<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Geometry for Letter A -->
    <g id="letter-a">
      <!-- Outer A frame with sharp apex and flat feet -->
      <path d="M 256 84 L 128 416 L 168 416 L 256 184 L 344 416 L 384 416 Z" />
      <!-- Horizontal crossbar -->
      <rect x="188" y="264" width="136" height="34" />
    </g>

    <!-- Geometry for Letter C -->
    <path id="letter-c" d="M 366 196 A 136 112 0 1 0 366 328" fill="none" stroke-width="36" stroke-linecap="butt" />

    <!-- Mask: Cuts out A from the top half of C (so A passes over C at the top) -->
    <mask id="mask-c">
      <rect width="512" height="512" fill="white" />
      <g clip-path="inset(0 0 256px 0)">
        <use href="#letter-a" fill="black" stroke="black" stroke-width="26" stroke-linejoin="miter" />
      </g>
    </mask>

    <!-- Mask: Cuts out C from the bottom half of A (so C passes over A at the bottom) -->
    <mask id="mask-a">
      <rect width="512" height="512" fill="white" />
      <g clip-path="inset(256px 0 0 0)">
        <use href="#letter-c" stroke="black" stroke-width="62" />
      </g>
    </mask>
  </defs>

  <!-- Dark Navy Background -->
  <rect width="512" height="512" fill="#030734" />

  <!-- Monogram Layers -->
  <use href="#letter-c" stroke="#FFFFFF" mask="url(#mask-c)" />
  <use href="#letter-a" fill="#FFFFFF" mask="url(#mask-a)" />
</svg>